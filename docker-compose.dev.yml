version: '3.8'

services:
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    container_name: mv-face-recognition-backend-dev
    ports:
      - "8000:8000"
    environment:
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
      - PYTHONUNBUFFERED=1
      - RELOAD=true
    volumes:
      # Mount source for hot reloading
      - ./backend:/app
      - ./source/videos:/app/source/videos:ro
      - ./source/photo/contestants:/app/source/photo/contestants:ro
      # Persistent data storage
      - backend_dev_data:/app/data
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - mv-dev-network

  frontend-dev:
    image: node:18-alpine
    container_name: mv-face-recognition-frontend-dev
    ports:
      - "5173:5173"
    working_dir: /app
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend-dev
    restart: unless-stopped
    networks:
      - mv-dev-network

volumes:
  backend_dev_data:
    driver: local

networks:
  mv-dev-network:
    driver: bridge