[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mv-face-recognition"
version = "0.1.0"
description = "MV Face Recognition System - AI-powered face recognition for video content"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MV Face Recognition Team"}
]
keywords = ["face-recognition", "ai", "computer-vision", "gradio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "yt-dlp",
    "requests",
    "beautifulsoup4",
    "lxml-html-clean>=0.2.2",
    "tqdm>=4.66.5",
    "selenium>=4.24.0",
    "webdriver-manager>=4.0.2",
    "tf-keras>=2.17.0",
    "pandas>=2.1.1",
    "streamlit>=1.38.0",
    "insightface",
    "onnxruntime>=1.19.2; sys_platform == 'darwin'",
    "onnxruntime-gpu>=1.19.2; sys_platform == 'win32'",
    "opencv-python",
    "freetype-py>=2.5.1",
    "pillow>=10.4.0",
    "ffmpeg-python>=0.2.0",
    "ruff>=0.6.8",
    "rich>=13.8.1",
    "chromadb>=0.6.3",
    "sentence-transformers>=4.0.1",
    "mediapipe>=0.10.21",
    "torch>=2.4.1",
    "gradio>=5.0.0",
    "plotly>=5.0.0",
    "fastapi>=0.100.0",
    "websockets>=11.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "umap-learn>=0.5.3",
    "datasets>=3.6.0",
    "huggingface-hub>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "black>=23.0.0",
    "ruff>=0.6.8",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
mv-face-recognition = "src.mv_face_recognition.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.json", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:coverage_html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.black]
target-version = ['py311']
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "insightface.*",
    "cv2.*",
    "onnxruntime.*",
    "chromadb.*",
    "sentence_transformers.*",
    "mediapipe.*",
    "yt_dlp.*",
]
ignore_missing_imports = true

[tool.pyrefly]
# Configure pyrefly to handle this project's mixed structure
import_roots = [
    ".",  # Root directory for top-level imports
    "src",  # src directory for src.* imports
]
