[project]
name = "mv-face-recognition"
version = "0.1.0"
description = "Tooling for the MV face-recognition pipeline (publisher, HF staging, checks)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Used by the retained utility scripts (portraits, HF staging, embeddings).
    "insightface>=0.7.3",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=11.3.0",
    "huggingface-hub[hf-xet]>=0.33.1",
]


[tool.uv]
package = false
dev-dependencies = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "mypy",
    "psutil>=6.1.1",
    "pip-audit>=2.9.0",
    "moto[s3]>=5.0.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | archive
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.11"
# mvp-processor is a separate project with its own pyproject and virtualenv; checking it
# from here collided on two `conftest` modules. Run its checks from its own directory.
exclude = '^(mvp-processor/|archive/|node_modules/|\.venv/)' 
# `scripts/archive/` keeps a copy of the retired batch driver, and the test packages each
# have their own conftest; explicit package bases lets mypy key modules by path instead of
# basename.
explicit_package_bases = true
mypy_path = "."
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "insightface.*",
    "chromadb.*",
    "ffmpeg.*",
    "numpy.*",
    "pandas.*",
    "yt_dlp.*",
    "moto.*",
    "yaml.*",
    # mvp-processor/src siblings import each other as top-level modules; they only
    # resolve when mypy runs from that directory.
    "face_detector",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Quarantined debt (refactor plan F(2)). The tests were written against APIs that
# have since moved, the debug/benchmark scripts are throwaway probes, and the test
# support modules wrap moto/yaml shims. Counting all of it hid the product-code
# number the ratchet gates. Both module-name forms are listed: tests/ has no
# __init__.py, so mypy roots each test package at its own directory
# (`contract.test_x`) or prefixes it (`tests.contract.test_x`) depending on invocation.
# Delete entries as files are repaired or removed — never widen this list.
module = [
    "tests.*",
    "tests",
    "unit.*",
    "contract.*",
    "integration.*",
    "performance.*",
    "benchmark.*",
    "validation.*",
    "conftest",
    "tests.conftest",
    "unit.conftest",
    "contract.conftest",
    "scripts.debug.*",
    "scripts.benchmarks.*",
    # These test files sit outside a package, so mypy names them as bare modules when
    # invoked from inside their directory.
    "test_security",
    "test_access_control",
    "test_compliance",
    "test_error_handling",
    "test_input_validation",
    "test_security_fixes",
    "test_security_performance",
    "test_face_detector",
    "test_face_parser",
    "test_recall",
    "test_quickstart",
    "test_roi_cache",
    "test_person_segmenter",
    "test_frame_optimizer",
    "test_metadata_compressor",
    "test_performance",
]
ignore_errors = true

[tool.pyright]
# archive/ is the retired Gradio GUI and old copies: kept for reference, not built.
exclude = ["archive"]
