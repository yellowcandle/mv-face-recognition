[project]
name = "mv-face-recognition"
version = "0.1.0"
description = "Optimized Face Recognition System with InsightFace & ChromaDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web and data collection
    "yt-dlp",
    "requests",
    "beautifulsoup4",
    "lxml-html-clean>=0.4.2",
    "selenium>=4.32.0",
    "webdriver-manager>=4.0.2",
    # Core ML and data processing
    "tf-keras~=2.16.0",
    "numpy<2.0.0",
    "torch>=2.7.0",
    "pandas>=2.2.3",
    # Face detection and recognition
    "insightface>=0.7.3",
    "mediapipe>=0.10.21",
    "chromadb>=1.0.9",
    # ONNX dependencies
    "onnx>=1.18.0",
    "onnxruntime>=1.19.2; sys_platform == 'darwin'",
    "onnxruntime-gpu>=1.19.2; sys_platform == 'win32'",
    # Image and video processing
    "opencv-contrib-python>=4.11.0.86",
    "pillow>=11.2.1",
    "ffmpeg-python>=0.2.0",
    "freetype-py>=2.5.1",
    # UI and visualization
    "streamlit>=1.45.1",
    "rich>=14.0.0",
    "typer>=0.15.4",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.3",
    "umap-learn>=0.5.5", # Added for UMAP visualization
    # Development
    "ruff>=0.11.9",
    "gradio>=5.29.1",
    "scikit-optimize>=0.10.2",
]

[tool.setuptools]
packages = ["src"]
package-dir = {"" = "."}
