    "yt-dlp",
    "requests",
    "beautifulsoup4",
    "lxml-html-clean>=0.4.1",
    "tqdm>=4.66.5",
    "selenium>=4.24.0",
    "webdriver-manager>=4.0.2",
    "tf-keras>=2.18.0",
    "pandas>=2.1.1",
    "streamlit>=1.38.0",
    "onnxruntime>=1.19.2; sys_platform == 'darwin'",
    "onnxruntime-gpu>=1.19.2; sys_platform == 'win32'",
    "opencv-python",
    "freetype-py>=2.5.1",
    "pillow>=10.4.0",
    "ffmpeg-python>=0.2.0",
    "ruff>=0.6.8",
    "mediapipe>=0.10.20",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "insightface>=0.7.3",
    "chromadb>=0.4.18",
    "matplotlib>=3.7.1",
