[project]
name = "mv-face-recognition"
version = "0.1.0"
description = "Face recognition system for MV contestants using ChromaDB and InsightFace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core framework
    "streamlit>=1.28.0",
    # Face recognition and computer vision
    "insightface>=0.7.3",
    "supervision>=0.19.0",
    "opencv-python>=4.8.0",
    "torch>=2.9.1",
    "torchvision>=0.20.1",
    "onnxruntime>=1.20.1",
    # Data processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=11.3.0",
    # Vector database for fast similarity search
    "chromadb>=0.4.0",
    # Media processing
    "ffmpeg-python>=0.2.0",
    "yt-dlp>=2024.8.6",
    # Cloud processing
    "modal>=0.64.0",
    # Utilities
    "tqdm>=4.65.0",
    # GUI Framework
    "PyQt6>=6.6.0",
    "PyQt6-Qt6>=6.6.0",
    "nicegui>=3.5.0",
    "typing-extensions>=4.0.0",
    "python-socketio>=5.14.0",
    "python-engineio>=4.0.0",
    "bidict>=0.22.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "orjson>=3.6.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "starlette>=0.49.1",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1.0",
    "aiohttp>=3.13.3",
    "urllib3>=2.6.3",
    "pyyaml>=6.0",
    "click>=8.2.1",
    "PyJWT>=2.10.1",
    "cryptography>=43.0.0",
    "filelock>=3.18.0",
    "fonttools>=4.61.1",
]

[project.scripts]
mv-face-recognition = "src.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "mypy",
    "psutil>=6.1.1",
    "pip-audit>=2.9.0",
    "moto[s3]>=5.0.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "insightface.*",
    "chromadb.*",
    "ffmpeg.*",
]
ignore_missing_imports = true
