[project]
name = "mv-face-recognition"
version = "0.1.0"
description = "Face recognition system for music videos"
readme = "README.md"
requires-python = ">=3.12.6"
dependencies = [
    "nicegui>=1.4.14",
    "insightface>=0.7.3",
    "opencv-python>=4.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "onnxruntime>=1.16.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "chromadb>=0.4.0",
    "ffmpeg-python>=0.2.0",
    "tqdm>=4.65.0",
    "typing-extensions>=4.0.0",
    "python-socketio>=5.0.0",
    "python-engineio>=4.0.0",
    "streamlit>=1.46.0",
]
