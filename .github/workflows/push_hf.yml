name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install huggingface_hub
          # Install Git LFS
          sudo apt-get update
          sudo apt-get install git-lfs
          git lfs install
      
      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure git
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # Try to push using huggingface_hub
          python -c "
          import os
          from huggingface_hub import HfApi, create_repo, Repository
          
          # Initialize HF API
          api = HfApi(token=os.environ['HF_TOKEN'])
          
          try:
              # Try to create the space if it doesn't exist
              repo_url = create_repo(
                  repo_id='yellowcandle/mv-face-recognition',
                  repo_type='space',
                  space_sdk='gradio',
                  exist_ok=True,
                  token=os.environ['HF_TOKEN']
              )
              print(f'Space created/verified: {repo_url}')
          except Exception as e:
              print(f'Space creation info: {e}')
          
          # Use git-based sync to avoid file encoding issues
          try:
              # Clone the HF Space repository
              os.system('git clone https://huggingface.co/spaces/yellowcandle/mv-face-recognition hf_space')
              os.chdir('hf_space')
              
              # Configure git and LFS
              os.system('git config user.email \"action@github.com\"')
              os.system('git config user.name \"GitHub Action\"')
              os.system('git lfs install')
              
              # Add remote for source repository
              os.system('git remote add source https://github.com/yellowcandle/mv-face-recognition.git')
              os.system('git fetch source main')
              
              # Reset to match source repository
              os.system('git reset --hard source/main')
              
              # Push to HF Space
              push_cmd = f'git push https://yellowcandle:{os.environ[\"HF_TOKEN\"]}@huggingface.co/spaces/yellowcandle/mv-face-recognition main --force'
              result = os.system(push_cmd)
              
              if result == 0:
                  print('Successfully synced to Hugging Face Space using git!')
              else:
                  print(f'Git push failed with code: {result}')
              
          except Exception as e:
              print(f'Sync error: {e}')
              # Fallback to git push
              print('Trying fallback git push...')
              os.system('git push -f https://yellowcandle:$HF_TOKEN@huggingface.co/spaces/yellowcandle/mv-face-recognition main')
          "
