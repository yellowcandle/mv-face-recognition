name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install huggingface_hub
          # Install Git LFS
          sudo apt-get update
          sudo apt-get install git-lfs
          git lfs install
      
      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure git
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # Try to push using huggingface_hub
          python -c "
          import os
          from huggingface_hub import HfApi, create_repo, Repository
          
          # Initialize HF API
          api = HfApi(token=os.environ['HF_TOKEN'])
          
          try:
              # Try to create the space if it doesn't exist
              repo_url = create_repo(
                  repo_id='yellowcandle/mv-face-recognition',
                  repo_type='space',
                  space_sdk='gradio',
                  exist_ok=True,
                  token=os.environ['HF_TOKEN']
              )
              print(f'Space created/verified: {repo_url}')
          except Exception as e:
              print(f'Space creation info: {e}')
          
          # Use selective sync to fit HF Spaces 1GB limit
          try:
              import shutil
              
              # Create fresh directory for clean deployment (avoiding accumulated repository size)
              print('Creating fresh HF Space deployment directory...')
              clone_url = f'https://yellowcandle:{os.environ[\"HF_TOKEN\"]}@huggingface.co/spaces/yellowcandle/mv-face-recognition'
              
              # Start fresh to avoid accumulated repository size issues
              os.makedirs('hf_space_fresh', exist_ok=True)
              os.chdir('hf_space_fresh')
              os.system(f'git init --initial-branch=main')
              os.system(f'git remote add origin {clone_url}')
              
              # Configure git and LFS for fresh deployment
              os.system('git config user.email \"action@github.com\"')
              os.system('git config user.name \"GitHub Action\"')
              os.system('git lfs install')
              
              # Optimize videos first for HF Spaces deployment
              print('🎬 Optimizing videos for HF Spaces (1GB limit)...')
              
              # Create optimized videos directory
              os.makedirs('../source/videos_hf_optimized', exist_ok=True)
              
              # Copy optimization script and run it
              if os.path.exists('../scripts/optimize_videos_for_hf.py'):
                  # Quick optimization for HF Spaces - 720p only for space savings
                  import subprocess
                  for video_file in os.listdir('../source/videos/'):
                      if video_file.endswith(('.mp4', '.mov', '.avi')):
                          input_path = f'../source/videos/{video_file}'
                          output_name = video_file.replace('.mp4', '_720p.mp4')
                          output_path = f'../source/videos_hf_optimized/{output_name}'
                          
                          if not os.path.exists(output_path):
                              cmd = [
                                  'ffmpeg', '-i', input_path,
                                  '-vf', 'scale=1280:-2',
                                  '-c:v', 'libx264', '-crf', '30',
                                  '-preset', 'medium', '-c:a', 'aac', '-b:a', '128k',
                                  '-movflags', '+faststart', '-y', output_path
                              ]
                              print(f'Optimizing: {video_file}')
                              subprocess.run(cmd, capture_output=True)
              
              # Essential files for HF Spaces (minimal deployment under 1GB)
              essential_files = [
                  '../app.py', '../requirements.txt', '../packages.txt',
                  '../Dockerfile', '../README.md', '../.gitattributes',
                  '../gradio_app.py', '../config.json', '../chroma_db.py',
                  '../contestant_info.csv',
                  '../src/', 
                  # Only include first 3 videos to minimize deployment size
                  '../source/videos_hf_clean/mv1_zao_xing_zhi_zhan.mp4',  # 33MB
                  '../source/videos_hf_clean/mv2_shi_fa_zhi_zhan.mp4',   # 30MB  
                  '../source/videos_hf_clean/mv3_nv_tuan_zhi_zhan.mp4',  # 31MB
                  # Note: Excluding fonts (34MB) - will use system fonts on HF Spaces
                  # Also skipping mv4 (45MB), mv5 (55MB), cache files, photos
              ]
              
              # Copy essential files
              for file_path in essential_files:
                  src = file_path.replace('../', '../')
                  dest = file_path.replace('../', './')
                  if os.path.exists(src):
                      try:
                          if os.path.isdir(src):
                              if os.path.exists(dest):
                                  shutil.rmtree(dest)
                              shutil.copytree(src, dest)
                          else:
                              # Create destination directory if needed
                              dest_dir = os.path.dirname(dest)
                              if dest_dir and not os.path.exists(dest_dir):
                                  os.makedirs(dest_dir, exist_ok=True)
                              shutil.copy2(src, dest)
                          print(f'Copied: {src} -> {dest}')
                      except Exception as e:
                          print(f'Error copying {src}: {e}')
              
              # Explicitly remove any large directories that shouldn't be there
              large_dirs_to_remove = [
                  './source/videos',  # 1.2GB original videos
                  './source/videos_hf_optimized',  # 194MB duplicate
                  './source/videos_optimized',  # 630MB optimized videos
                  './source/photo',  # 112MB photos
                  './cache/',  # ALL cache files (~16MB) - will be generated on-demand
              ]
              
              for dir_path in large_dirs_to_remove:
                  if os.path.exists(dir_path):
                      try:
                          if os.path.isdir(dir_path):
                              shutil.rmtree(dir_path)
                          else:
                              os.remove(dir_path)
                          print(f'Removed large directory: {dir_path}')
                      except Exception as e:
                          print(f'Error removing {dir_path}: {e}')
              
              # Create deployment notes
              with open('HF_DEPLOYMENT_INFO.md', 'w') as f:
                  f.write('''# HF Spaces Deployment Information
              
              This is a FRESH minimal deployment to reset repository size and fit HF Spaces 1GB limit.
              
              ## What's Included:
              - ✅ **Videos**: 3 optimized 720p MV videos with ASCII filenames (~94MB)
                - mv1_zao_xing_zhi_zhan.mp4, mv2_shi_fa_zhi_zhan.mp4, mv3_nv_tuan_zhi_zhan.mp4
              - ✅ **Source Code**: Full application functionality (~50MB)
              
              ## What's Excluded (to fit 1GB limit):
              - ❌ **Fonts**: Chinese/Japanese font file (34MB)
                - *Solution*: Uses system fonts on HF Spaces for Chinese/Japanese text
              - ❌ **Photos**: Contestant reference photos (112MB)
                - *Solution*: Users can upload photos via Gradio interface
              - ❌ **Cache**: Pre-computed embeddings and ChromaDB (~16MB)
                - *Solution*: Generated automatically on first use
              - ❌ **Videos 4-5**: mv4_ji_xian_pai_mv.mp4 (45MB), mv5_bo_qian_re_shen.mp4 (55MB)
                - *Solution*: Can be added later once initial deployment succeeds
              
              ## Video Optimizations:
              - **Filenames**: ASCII names (e.g., mv1_zao_xing_zhi_zhan.mp4)
              - **Display**: Original Chinese/Japanese titles in interface
              - **Quality**: 720p (1280x534) for optimal face recognition
              - **Compression**: H.264, CRF 30 (~90% size reduction)
              
              ## Usage:
              1. Upload contestant photos through the interface
              2. Select videos from the optimized collection
              3. Run face recognition analysis
              
              **Full version with all assets**: Available in GitHub repository
              ''')
              
              # Set up Git LFS for large files (videos and fonts)
              os.system('git lfs track \"*.mp4\" \"*.mov\" \"*.avi\" \"*.ttf\" \"*.otf\"')
              
              # Add and commit
              os.system('git add .')
              os.system('git commit -m \"Ultra-minimal deployment: 3 videos + source code (~144MB, no fonts)\" || echo \"No changes to commit\"')
              
              # Force push to completely replace repository content and reset size
              print('Force pushing to reset HF Space repository size...')
              result = os.system('git push origin main --force --set-upstream')
              
              if result == 0:
                  print('Successfully deployed optimized version to HF Spaces!')
              else:
                  print(f'Git push failed with code: {result}')
              
          except Exception as e:
              print(f'Sync error: {e}')
              # Fallback to git push
              print('Trying fallback git push...')
              os.system('git push -f https://yellowcandle:$HF_TOKEN@huggingface.co/spaces/yellowcandle/mv-face-recognition main')
          "
