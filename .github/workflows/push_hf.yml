name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install huggingface_hub
        run: pip install huggingface_hub
      
      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure git
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # Try to push using huggingface_hub
          python -c "
          import os
          from huggingface_hub import HfApi, create_repo, Repository
          
          # Initialize HF API
          api = HfApi(token=os.environ['HF_TOKEN'])
          
          try:
              # Try to create the space if it doesn't exist
              repo_url = create_repo(
                  repo_id='yellowcandle/mv-face-recognition',
                  repo_type='space',
                  space_sdk='gradio',
                  exist_ok=True,
                  token=os.environ['HF_TOKEN']
              )
              print(f'Space created/verified: {repo_url}')
          except Exception as e:
              print(f'Space creation info: {e}')
          
          # Clone and sync
          try:
              repo = Repository(
                  local_dir='./hf_space',
                  clone_from='yellowcandle/mv-face-recognition',
                  repo_type='space',
                  token=os.environ['HF_TOKEN']
              )
              
              # Copy files
              import shutil
              import os
              
              # Essential files for HF Spaces
              files_to_copy = [
                  'app.py', 'requirements.txt', 'packages.txt',
                  'Dockerfile', 'src/', 
                  'gradio_app.py', 'config.json', 'chroma_db.py'
              ]
              
              for file_path in files_to_copy:
                  if os.path.exists(file_path):
                      if os.path.isdir(file_path):
                          if os.path.exists(f'./hf_space/{file_path}'):
                              shutil.rmtree(f'./hf_space/{file_path}')
                          shutil.copytree(file_path, f'./hf_space/{file_path}')
                      else:
                          shutil.copy2(file_path, f'./hf_space/{file_path}')
                      print(f'Copied: {file_path}')
              
              # Copy README.md with YAML metadata for HF Space
              if os.path.exists('README.md'):
                  shutil.copy2('README.md', './hf_space/README.md')
                  print('Copied: README.md (with HF Space metadata)')
              
              # Push changes
              repo.push_to_hub(commit_message='Auto-sync from GitHub')
              print('Successfully synced to Hugging Face Space!')
              
          except Exception as e:
              print(f'Sync error: {e}')
              # Fallback to git push
              print('Trying fallback git push...')
              os.system('git push -f https://yellowcandle:$HF_TOKEN@huggingface.co/spaces/yellowcandle/mv-face-recognition main')
          "
