name: Comprehensive Test Suite

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: mvp-processor/package-lock.json
    
    - name: Install dependencies
      working-directory: mvp-processor
      run: npm ci
    
    - name: Run linting
      working-directory: mvp-processor
      run: npm run lint
    
    - name: Run unit tests
      working-directory: mvp-processor
      run: npm run test:coverage
    
    - name: Install Playwright browsers
      working-directory: mvp-processor
      run: npx playwright install --with-deps
    
    - name: Build frontend
      working-directory: mvp-processor
      run: npm run build
    
    - name: Run E2E tests
      working-directory: mvp-processor
      run: npm run test:e2e
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: mvp-processor/coverage
        flags: frontend
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: playwright-report
        path: mvp-processor/playwright-report/

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
        sudo apt-get install -y ffmpeg
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('mvp-processor/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      working-directory: mvp-processor
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
    
    - name: Run linting
      working-directory: mvp-processor
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run unit tests
      working-directory: mvp-processor
      run: pytest tests/unit/ -v --cov=src --cov-report=xml -m "unit and not gpu"
    
    - name: Run integration tests
      working-directory: mvp-processor
      run: pytest tests/integration/ -v -m "not slow and not gpu and not network"
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: mvp-processor
        flags: python

  scripts-tests:
    name: Scripts Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: scripts/package-lock.json
    
    - name: Install dependencies
      working-directory: scripts
      run: npm ci
    
    - name: Run linting
      working-directory: scripts
      run: npm run lint
    
    - name: Run unit tests
      working-directory: scripts
      run: npm run test:coverage
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: scripts/coverage
        flags: scripts

  worker-tests:
    name: Worker Tests  
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: worker/package-lock.json
    
    - name: Install dependencies
      working-directory: worker
      run: npm ci
    
    - name: Run linting
      working-directory: worker
      run: npm run lint
    
    - name: Run unit tests
      working-directory: worker
      run: npm run test:coverage
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: worker/coverage
        flags: worker

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [frontend-tests, python-tests, scripts-tests, worker-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Install Python dependencies
      working-directory: mvp-processor
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
    
    - name: Install Node.js dependencies
      run: |
        cd mvp-processor && npm ci
        cd ../scripts && npm ci
        cd ../worker && npm ci
    
    - name: Create test video files
      run: |
        mkdir -p source/videos
        # Create small test video files
        ffmpeg -f lavfi -i testsrc=duration=5:size=320x240:rate=1 -f lavfi -i sine=frequency=1000:duration=5 -c:v libx264 -c:a aac -shortest source/videos/test-video-1.mp4
        ffmpeg -f lavfi -i testsrc=duration=3:size=320x240:rate=1 -f lavfi -i sine=frequency=500:duration=3 -c:v libx264 -c:a aac -shortest source/videos/test-video-2.mp4
    
    - name: Test processing pipeline
      working-directory: mvp-processor
      run: |
        python src/process_video.py --input ../source/videos/test-video-1.mp4 --no-upload --output-name test-integration
    
    - name: Verify processing outputs
      run: |
        test -f processed_videos/test-integration_720p.mp4
        test -f metadata/test-integration_metadata.json
        test -f thumbnails/test-integration_thumb.jpg
    
    - name: Test frontend build
      working-directory: mvp-processor
      run: npm run build
    
    - name: Test asset embedding
      working-directory: scripts
      run: node update-worker-assets.js
    
    - name: Verify worker assets
      run: |
        grep -q "STATIC_ASSETS.*app.html" worker/index.js

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [frontend-tests, python-tests, scripts-tests, worker-tests, integration-tests]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        echo "Frontend tests: ${{ needs.frontend-tests.result }}"
        echo "Python tests: ${{ needs.python-tests.result }}"
        echo "Scripts tests: ${{ needs.scripts-tests.result }}"
        echo "Worker tests: ${{ needs.worker-tests.result }}"
        echo "Integration tests: ${{ needs.integration-tests.result }}"
        
        if [[ "${{ needs.frontend-tests.result }}" == "failure" || 
              "${{ needs.python-tests.result }}" == "failure" || 
              "${{ needs.scripts-tests.result }}" == "failure" || 
              "${{ needs.worker-tests.result }}" == "failure" || 
              "${{ needs.integration-tests.result }}" == "failure" ]]; then
          echo "❌ Some tests failed"
          exit 1
        else
          echo "✅ All tests passed"
        fi
