name: Checks

# Replaces the old "Comprehensive Test Suite", which was disabled manually on
# 2025-09-02 and referenced files that no longer exist:
# mvp-processor/package-lock.json, worker/index.js, and a SvelteKit frontend
# that was deleted. This workflow gates only what is actually green today:
#
#   - web typecheck (apps/viewer, apps/admin via the pnpm workspace)
#   - worker typecheck + unit tests
#   - python: mypy and ruff counts must not exceed scripts/ci/baseline.json
#
# The two pytest suites are NOT gated yet: root is 140 failed / 17 errors and
# mvp-processor is 8 failed. Both are pre-existing and dominated by stale test
# APIs against a refactored source. Workstream F of docs/refactor-plan.md
# quarantines that debt, after which those suites become gating. Gating them
# today would only make CI permanently red.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `check` is `tsc --noEmit` in both apps; shared is typechecked
      # through them.
      - run: pnpm --filter @mv/viewer check
      - run: pnpm --filter @mv/admin check
      - run: pnpm --filter @mv/shared check
      - run: pnpm --filter @mv/shared test

  worker:
    name: Worker typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  mvp-tests:
    name: mvp-processor tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp-processor
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # 100/100 today, and verified to pass with the InsightFace model cache removed,
      # so this suite needs no weights, video files or network at test time.
      - run: uv sync --frozen
      - run: uv run python -m pytest tests/unit tests/contract -q

  python:
    name: Python baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # The script shells out to pinned uvx mypy/ruff and compares the counts
      # against scripts/ci/baseline.json. No project install is needed: the
      # heavy imports sit in mypy's ignore_missing_imports overrides.
      - run: uv run --no-project python scripts/ci/check_baselines.py

      # The root suite fails by construction today (140 failed / 17 errors, all
      # pre-existing), so the gate is a recorded count that may not get worse.
      # `|| true` keeps the job alive; the script decides, and a crashed run with
      # no summary line fails rather than reading as zero failures.
      - name: Root pytest (recorded-failure baseline)
        run: |
          uv run --no-project --with pytest --with numpy \
            --with opencv-python-headless --with pandas \
            python -m pytest tests/ -q --tb=no -p no:cacheprovider \
            > pytest-root.log 2>&1 || true
          uv run --no-project python scripts/ci/check_baselines.py \
            --pytest-log pytest-root.log
