# Fly.io configuration for MV Face Recognition Backend
app = "mv-face-recognition-backend"
primary_region = "sjc"  # San Jose (close to user)

[build]
  dockerfile = "Dockerfile.backend"

[env]
  PORT = "8000"
  PYTHONPATH = "/app"
  DATA_DIR = "/data"
  # Fly.io will auto-inject FLY_APP_NAME, FLY_REGION, FLY_MACHINE_ID

[experimental]
  auto_rollback = true

[[services]]
  internal_port = 8000
  processes = ["app"]
  protocol = "tcp"
  script_checks = []

  # HTTP service configuration
  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 500

  # Health checks
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["http", "tls"]

  # HTTP checks for health monitoring
  [[services.http_checks]]
    interval = "15s"
    grace_period = "10s"
    method = "get"
    path = "/health"
    protocol = "http"
    timeout = "5s"
    tls_skip_verify = false
    
    [services.http_checks.headers]
      User-Agent = "fly-health-check"

  # Readiness check
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"

# HTTP service configuration
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# Persistent volume mounts (CRITICAL DATA - respecting CLAUDE.md)
[[mounts]]
  source = "mv_videos_vol"
  destination = "/data/videos"

[[mounts]]
  source = "mv_embeddings_vol"
  destination = "/data/embeddings"

[[mounts]]
  source = "mv_metadata_vol"
  destination = "/data/metadata"

[[mounts]]
  source = "mv_chromadb_vol"
  destination = "/data/chroma_db"

# VM configuration with GPU support
[vm]
  cpu_kind = "performance"  # Use performance CPUs for ML workloads
  cpus = 4
  memory_mb = 8192
  gpu_kind = "a10"  # NVIDIA A10 GPU for CUDA acceleration

# Deploy configuration
[deploy]
  release_command = "python fix_embeddings.py --validate"

# Metrics
[metrics]
  port = 9091
  path = "/metrics" 