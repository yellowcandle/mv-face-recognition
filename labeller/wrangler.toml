# Labelling Worker: the only deployed thing that writes, and it writes labels only.
# Separate from worker/ because the public viewer must stay read-only (ADR 0003).
# Nothing here has been provisioned. Every id below is a placeholder.
name = "mv-labeller"
main = "src/index.ts"
compatibility_date = "2024-11-08"

[observability]
enabled = true

[[kv_namespaces]]
binding = "LABELS"
id = "REPLACE_ME"          # wrangler kv namespace create LABELS
preview_id = "REPLACE_ME_PREVIEW"

[[r2_buckets]]
binding = "LABEL_CROPS"
bucket_name = "mv-labelling-crops"

[vars]
# Left EMPTY on purpose: with either unset the Worker answers 503 to everything (fails closed).
# Fill both in at deploy time from the Access application (neither is a secret):
#   CF_ACCESS_TEAM_DOMAIN = "<team>.cloudflareaccess.com"
#   CF_ACCESS_AUD         = "<the Access application's AUD tag>"
# If you prefer `wrangler secret put CF_ACCESS_AUD`, DELETE the line here first: a var and a
# secret with the same name collide on deploy.
CF_ACCESS_TEAM_DOMAIN = ""
CF_ACCESS_AUD = ""
LOG_LEVEL = "info"
