version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=8080
      - GRADIO_SHARE=false
      - GRADIO_DEBUG=true
      - NO_ALBUMENTATIONS_UPDATE=1
      - INSIGHTFACE_DISABLE_LOGGING=1
    volumes:
      # Mount local directories for development
      - ./source:/app/source
      - ./cache:/app/cache
      - ./output:/app/output
      - ./fonts:/app/fonts
      - ./config.json:/app/config.json:ro
      - ./contestant_info.csv:/app/contestant_info.csv:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Add a reverse proxy for production-like setup
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    profiles:
      - production

volumes:
  app_cache:
  app_output: