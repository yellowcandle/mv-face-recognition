version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mv-face-recognition-backend
    ports:
      - "8000:8000"
    environment:
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount source directories for video processing
      - ./source/videos:/app/source/videos:ro
      - ./source/photo/contestants:/app/source/photo/contestants:ro
      # Persistent data storage
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - mv-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mv-face-recognition-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - mv-network

volumes:
  backend_data:
    driver: local

networks:
  mv-network:
    driver: bridge