# Docker Compose for local testing of MV Face Recognition Fly.io deployment
version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DATA_DIR=/data
      - PORT=8000
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      # Mount local data directories for testing
      - ./source/videos:/data/videos/source
      - ./processed_videos:/data/videos/processed
      - ./source/photo/contestants:/data/embeddings/contestants
      - ./metadata:/data/metadata
      - ./data/chroma_db:/data/chroma_db
      - ./output:/data/output
      - ./clips:/data/clips
    # Enable GPU access for CUDA acceleration (requires nvidia-docker)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://backend:8000
      - NODE_ENV=production
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  default:
    name: mv-face-recognition-network 