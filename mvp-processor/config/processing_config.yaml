# MV Face Recognition MVP Configuration - Integrated with Deployment Architecture
video:
  # ANTI-FLICKER FIX: Process more frames to eliminate gaps
  fps_sample_rate: 12  # Process double density to reduce gaps (was 6, max gap now ~0.08s)
  max_frames: 0  # 0 = process entire video
  resize_width: 1920  # Maximum width for processing
  preserve_audio: true  # Use FFmpeg to maintain original audio tracks
  
  # Output video settings aligned with deployment
  output_formats:
    - format: "mp4"
      quality: "high"
      resolution: "1080p"
      codec: "h264"
    - format: "mp4" 
      quality: "medium"
      resolution: "720p"
      codec: "h264"

# Enhanced Face Detection with Hardware Acceleration
face_detection:
  model: "insightface"  # Use InsightFace buffalo_l model
  model_path: "../models/buffalo_l"
  min_confidence: 0.3
  max_faces_per_frame: 96
  enable_hardware_acceleration: true  # Auto-detect Apple Silicon/CUDA
  use_unified_system: true  # Enable unified embedding system for consistent recognition
  
  # Hardware acceleration preferences (in order of preference)
  backend_priority:
    - "apple_silicon_metal"  # Apple Silicon M1/M2/M3 with Metal Performance Shaders
    - "cuda"                 # NVIDIA CUDA GPU acceleration
    - "cpu"                  # CPU fallback
  
  # Memory optimization settings
  memory_optimization:
    enable_unified_memory_optimization: true  # Apple Silicon unified memory optimization
    prefer_fp16: true                        # Use half-precision for better Apple Silicon performance
    adaptive_batch_size: true               # Automatically adjust batch size based on hardware
    memory_pressure_relief: true            # Enable memory pressure management
    garbage_collection_threshold: 0.85      # Trigger cleanup at 85% memory usage
  
# Face Recognition with ChromaDB Integration
face_recognition:
  similarity_threshold: 0.2  # Confidence threshold (much lower to allow more matches)
  tolerance: 0.8  # Higher = more lenient matching  
  max_distance: 15.0  # Much higher maximum face distance to allow more recognition
  use_existing_embeddings: true
  embeddings_path: "../source/photo/contestants"
  enable_interpolation: true  # Disabled to prevent bbox persistence between detections
  confidence_decay: 0.95  # For interpolated frames (not used when interpolation disabled)
  
  # Trajectory-based recognition thresholds
  trajectory_confidence_threshold: 0.02  # Very low aggregate trajectory confidence 
  single_frame_threshold: 0.02          # Very low fallback threshold
  temporal_boost_factor: 1.2            # Confidence boost for consistent temporal recognition

# Contestant Database (Critical Files)
contestants:
  photo_dir: "../source/photo/contestants"  # 95 contestant photos and embeddings (fixed path)
  embeddings_cache: "data/embeddings_cache.pkl"
  info_csv: "../source/contestant_info.csv"  # Essential contestant mapping (fixed path)
  chroma_db_path: "../database/chroma_db"

# Face Tracking Configuration - Anti-Flickering Optimized
face_tracking:
  enable_tracking: true
  
  # Tracking Algorithm Selection
  algorithm: "supervision"  # Options: "custom", "supervision"
  # custom: Original custom face tracker (faster, optimized for faces)  
  # supervision: Optimized Supervision ByteTracker (proven algorithms with performance optimizations)
  
  # Temporal window settings - Extended for stability
  tracking_window: 2.0              # Extended duration for better temporal stability (4x longer)
  max_trajectory_gap: 6             # Extended gap tolerance to maintain continuity
  min_trajectory_length: 5          # Higher minimum for more stable trajectories
  
  # Spatial correlation thresholds - Tightened for stability
  spatial_threshold: 0.5            # Higher IoU requirement (0.3 → 0.5) to prevent jumping
  proximity_boost: 0.95             # Stronger proximity preference for temporal consistency
  location_stability_factor: 0.90   # Much higher stability preference for consistent locations
  
  # Confidence smoothing and aggregation - Stronger smoothing
  confidence_smoothing: 0.95        # Much stronger temporal smoothing (0.85 → 0.95) 
  confidence_threshold: 0.20        # Slightly lower aggregated threshold for stability
  single_frame_fallback: 0.10       # Lower fallback threshold to reduce noise
  min_stable_detections: 5          # Higher minimum for trajectory stability (3 → 5)
  
  # Re-identification configuration - Reduced frequency
  re_recognition_interval: 8        # Much less frequent re-ID to prevent switching (3 → 8)
  identity_voting_weight: 1.2       # Slightly higher voting weight for stability
  temporal_consistency_bonus: 0.25  # Higher bonus for consistent recognitions (0.15 → 0.25)
  
  # Trajectory management
  max_active_trajectories: 20       # Keep same for performance
  trajectory_cleanup_interval: 45   # Less frequent cleanup (30 → 45) for stability
  memory_optimization: true         # Enable memory-efficient trajectory management
  
  # Performance tuning (aligned with 12 FPS detection)  
  detection_sampling_rate: 12        # Match doubled FPS sampling rate
  interpolation_smoothing: 0.95     # Stronger interpolation smoothing (0.85 → 0.95)
  adaptive_threshold: true          # Enable adaptive confidence thresholds based on scene complexity
  
  # Majority Voting System - FIXED for Better Recognition
  majority_voting:
    enable: true                    # Enable enhanced majority voting system
    min_votes_for_decision: 2       # FIXED: Lowered from 5 to 2 for faster decisions
    consensus_threshold: 0.45       # FIXED: Lowered from 65% to 45% for more lenient consensus
    confidence_gap_threshold: 0.15  # FIXED: Lowered from 30% to 15% for achievable gaps
    temporal_decay_factor: 0.95     # FIXED: Slower decay (0.9 → 0.95) to preserve voting history
    stability_requirement: 3        # FIXED: Lowered from 6 to 3 frames for faster identity assignment

# Processing Settings for Dense Metadata
processing:
  enable_tracking: true             # Global tracking enable flag (use face_tracking.enable_tracking for detailed control)
  smoothing_window: 5               # Frame window for temporal smoothing (deprecated, use face_tracking.tracking_window)
  batch_size: 8                     # OPTIMIZED: Reduced for memory efficiency (32 → 8)
  parallel_processing: true
  generate_dense_metadata: true     # Frame-level granularity
  enable_interpolation: false       # Disabled to prevent bbox persistence - use display interpolation instead
  
  # OPTIMIZATION CONFIGURATION - PHASE 1 MEMORY FIX
  enable_optimized_pipeline: true   # Enable stream-based processing (90% memory reduction)
  streaming_batch_size: 8           # Frames per batch (controls memory usage)
  memory_pressure_monitoring: true  # Real-time memory monitoring and relief

# Smart Frame Interpolation - Enhanced Anti-Flickering Display
interpolation:
  enable_display_interpolation: true    # Enable smooth bbox display across all video frames
  max_interpolation_gap: 0.6           # Extended interpolation window (0.4 → 0.6s) for smoother display
  interpolation_confidence_decay: 0.97  # Much slower confidence decay (0.9 → 0.97) to maintain stability
  min_interpolation_confidence: 0.15    # Lower minimum threshold (0.25 → 0.15) for extended display
  max_interpolation_frames: 18          # More interpolation frames (12 → 18) for 25fps * 0.7s
  enable_position_prediction: true      # Use trajectory velocity for position prediction
  trajectory_termination_strict: false  # Allow brief extension (true → false) for smoother transitions

# AGGRESSIVE ANTI-FLICKERING SYSTEM
anti_flicker:
  # Position stability
  position_smoothing_factor: 0.95       # Strong position smoothing (exponential moving average)
  spatial_distance_threshold: 800       # Large spatial tolerance to prevent jumping (was 200px)
  minimum_movement_threshold: 5         # Ignore tiny movements below 5 pixels
  
  # Visual state locking  
  visual_state_lock_duration: 1.0       # Lock visual appearance for 1 second minimum
  confidence_hysteresis: 0.15           # Require 0.15 confidence change to update colors
  minimum_display_frames: 8             # Force minimum 8 frame visibility
  
  # Emergency static mode
  enable_static_rendering: false         # EMERGENCY ENABLED: disable all dynamic visual effects
  use_single_color_per_trajectory: true # One color per trajectory, never changes
  disable_confidence_indicators: true   # Remove confidence from labels to prevent text flicker

# Output Settings Aligned with Deployment Scripts
output:
  processed_dir: "../processed_videos"  # For upload-to-r2.js
  thumbnails_dir: "../thumbnails"
  metadata_dir: "../metadata"  # For upload-metadata.js
  galleries_dir: "data/galleries"

# Cloudflare Integration with Environment Variables
cloudflare:
  account_id: "${CLOUDFLARE_ACCOUNT_ID}"
  api_token: "${CLOUDFLARE_API_TOKEN}"
  r2_access_key: "${CLOUDFLARE_R2_ACCESS_KEY_ID}"
  r2_secret_key: "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}"
  r2_bucket: "mv-face-recognition-videos"
  r2_endpoint: "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
  worker_url: "https://mv-face-recognition-api.herballemon.workers.dev"

# Integration with Deployment Scripts
integration:
  upload_to_cloudflare: false
  use_external_scripts: true  # Use Node.js upload scripts
  scripts_dir: "../scripts"
  auto_deploy_worker: false  # Manual deployment step

# Audio Preservation (FFmpeg Integration)
audio:
  preserve_audio: true
  ffmpeg_path: "ffmpeg"
  merge_strategy: "copy"  # Copy streams without re-encoding

# Performance Optimization - ENHANCED GPU ACCELERATION
performance:
  hardware_acceleration: "auto"  # auto, apple_silicon, cuda, cpu
  processing_threads: 4          # Parallel processing worker threads
  memory_limit_gb: 8             # Memory limit for automatic pressure relief
  
  # GPU ACCELERATION SETTINGS
  gpu_acceleration:
    enable_accelerated_pipeline: true   # Enable GPU-accelerated face detection pipeline
    optimal_batch_size: "auto"          # Auto-calculate optimal batch size based on hardware
    enable_gpu_batching: true           # Process frames in GPU-optimized batches
    prefer_fp16: true                   # Use half-precision for Apple Silicon optimization
    gpu_memory_pool: true               # Enable GPU memory pooling for efficiency
    
    # Hardware-specific optimizations
    apple_silicon_optimizations:
      use_metal_performance_shaders: true     # Enable Metal Performance Shaders
      unified_memory_optimization: true       # Optimize for unified memory architecture
      adaptive_batch_scaling: true           # Scale batch size based on memory pressure
      metal_preprocessing: true              # Use Metal for image preprocessing
      
    cuda_optimizations:
      enable_tensorrt: false                 # Enable TensorRT optimization (if available)
      cuda_memory_fraction: 0.8             # Fraction of GPU memory to use
      cudnn_benchmark: true                  # Enable cuDNN benchmark mode
      mixed_precision: true                  # Enable automatic mixed precision
  
  # VECTORIZED OPERATIONS
  vectorization:
    enable_numba: true                  # Enable Numba JIT compilation for 2-3x speedup
    enable_vectorized_similarity: true # Use vectorized similarity calculations
    batch_similarity_search: true      # Process similarity searches in batches
    
  # FAISS ACCELERATION
  faiss_acceleration:
    enable_faiss: true                  # Enable FAISS for fast similarity search
    index_type: "IVFFlat"              # FAISS index type (Flat, IVFFlat, HNSW)
    use_faiss_gpu: true                # Use FAISS GPU acceleration if available
    nprobe: 1                          # FAISS search parameter for IVFFlat
    build_index_on_startup: true       # Pre-build FAISS index for faster searches
    save_index_cache: true             # Save/load FAISS index to disk for persistence
    
  # PIPELINE OPTIMIZATION SETTINGS
  optimization:
    enable_parallel_batching: true      # Enable parallel frame batch processing
    enable_embedding_cache: true        # Smart caching to reduce redundant computations
    enable_memory_monitoring: true      # Real-time memory pressure monitoring
    cache_size: 1000                    # Maximum cached embeddings (LRU eviction)
    memory_warning_threshold: 0.8       # Warning at 80% memory usage
    memory_critical_threshold: 0.9      # Critical cleanup at 90% memory usage
    enable_memory_pool: true            # Enable GPU memory pooling
    
    # Adaptive performance tuning
    adaptive_batch_size: true           # Automatically adjust batch size based on memory
    min_batch_size: 2                   # Minimum frames per batch
    max_batch_size: 32                  # Maximum frames per batch (increased for GPU)
    performance_profiling: false        # Enable detailed performance metrics (dev only)
    benchmark_optimizations: true       # Run benchmark to find optimal settings

# Professional Visualization Configuration (Supervision)
visualization:
  enable_supervision: true  # Use professional Roboflow Supervision annotators
  
  # Bounding box styling
  bbox_thickness: 2
  interpolated_bbox_thickness: 1
  
  # Label styling
  text_scale: 0.6
  text_thickness: 1
  text_padding: 5
  
  # Tracking trail visualization
  enable_tracking_trails: true
  trail_length: 30  # Number of points in tracking trail
  trail_thickness: 2
  
  # Color scheme for confidence levels
  color_palette:
    high_confidence: "#00FF00"      # Bright green (>= 0.8)
    medium_confidence: "#FFA500"    # Orange (>= 0.6)
    low_confidence: "#FF0000"       # Red (< 0.6)
    interpolated_high: "#90EE90"    # Light green (interpolated >= 0.6)
    interpolated_medium: "#FFB366"  # Light orange (interpolated >= 0.4)
    interpolated_low: "#FF6666"     # Light red (interpolated < 0.4)
  
  # Fallback configuration
  fallback_to_opencv: true  # Use OpenCV if Supervision fails

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/processing.log"