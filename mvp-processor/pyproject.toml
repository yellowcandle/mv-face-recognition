[project]
name = "mvp-processor"
version = "0.1.0"
description = "Video processing pipeline for face recognition"
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "face-recognition>=1.3.0",
    "dlib>=19.24.0",
    "moviepy>=1.0.3",
    "requests>=2.31.0",
    "boto3>=1.28.0",
    "PyYAML>=6.0",
    "click>=8.1.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.3",
    "imageio-ffmpeg>=0.5.1",
    "face-recognition-models",
]

[tool.uv.sources]
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models" }
