[project]
name = "mvp-processor"
version = "0.1.0"
description = "Video processing pipeline for face recognition"
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "face-recognition>=1.3.0",
    "dlib>=19.24.0",
    "moviepy>=1.0.3",
    "requests>=2.31.0",
    "boto3>=1.28.0",
    "PyYAML>=6.0",
    "click>=8.1.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.3",
    "imageio-ffmpeg>=0.5.1",
    "face-recognition-models",
    "ultralytics>=8.3.203",
    "onnx>=1.17.0",
    "onnxslim>=0.1.70",
    "onnxruntime>=1.20.1",
]

[tool.uv.sources]
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[dependency-groups]
dev = [
    "moto[s3]>=5.0.28",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.1",
]
