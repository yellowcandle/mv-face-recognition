[project]
name = "mvp-processor"
version = "0.1.0"
description = "Video processing pipeline for face recognition"
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "face-recognition>=1.3.0",
    "dlib>=19.24.0",
    "moviepy>=1.0.3",
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "click>=8.1.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.3",
    "imageio-ffmpeg>=0.5.1",
    "face-recognition-models",
    "supervision>=0.25.1",
    "moviepy>=1.0.3",
    "boto3>=1.37.38",
    "insightface>=0.7.3",
    "onnxruntime>=1.20.1",
]

[project.optional-dependencies]
cloud = [
    "boto3>=1.28.0",
]
dev = [
    # Testing dependencies
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "pytest-asyncio>=0.21.1",
    "pytest-benchmark>=4.0.0",
    # Test data and mocking
    "moto>=5.0.0",
    "fakeredis>=2.17.0",
    "responses>=0.23.1",
    "httpretty>=1.1.4",
    # Test utilities
    "factory-boy>=3.3.0",
    "Faker>=19.3.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models" }
